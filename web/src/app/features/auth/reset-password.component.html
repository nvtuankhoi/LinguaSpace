<div class="auth">
  <a class="auth-back" routerLink="/">
    <app-icon name="sparkles" [size]="20" />
    <span>LinguaSpace</span>
  </a>

  <div class="auth-card card">
    @if (done()) {
      <div>
        <h1>Password reset</h1>
        <p class="muted">Your password has been changed. You can now log in.</p>
      </div>
      <a class="btn btn-primary btn-block" routerLink="/login">Go to login</a>
    } @else {
      <div>
        <h1>Set a new password</h1>
        <p class="muted">Choose a new password for your account.</p>
      </div>

      @if (msg()) {
        <div class="alert" role="alert">{{ msg()!.text }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <label class="field">
          <span>New password</span>
          <input type="password" formControlName="newPassword" autocomplete="new-password" />
        </label>
        <label class="field">
          <span>Confirm password</span>
          <input type="password" formControlName="confirm" autocomplete="new-password" />
        </label>
        <button class="btn btn-primary btn-block" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Saving…' : 'Reset password' }}
        </button>
      </form>
    }
  </div>
</div>
